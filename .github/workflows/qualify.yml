name: Qualify and publish task-manager

on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      expected_schema_inputs:
        description: JSON array of exact publisher schema inputs
        required: true
        type: string
      reuse_image:
        description: Existing qualified image pin as JSON when production inputs are unchanged
        required: false
        type: string
      expected_source_sha:
        description: Full commit SHA of the selected task-manager ref
        type: string
        required: true
      source_controller_sha:
        description: Full commit SHA of source-controller
        type: string
        required: true
      team_registry_sha:
        description: Full commit SHA of team-registry
        type: string
        required: true
      flow_registry_sha:
        description: Full commit SHA of flow-registry
        type: string
        required: true
      executor_registry_sha:
        description: Full commit SHA of executor-registry
        type: string
        required: true
      executor_docker_openhands_sha:
        description: Full commit SHA of the Docker OpenHands Executor
        type: string
        required: true

# Serialize version selection and publication on each Git ref.
concurrency:
  group: qualification-${{ github.ref }}
  queue: max

permissions:
  contents: read

jobs:
  application:
    if: github.event_name != 'push' || !github.event.deleted
    name: Build and test the application
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      stage: ${{ steps.version.outputs.stage }}
      production_identity: ${{ steps.version.outputs.production_identity }}
      reuse_digest: ${{ steps.version.outputs.reuse_digest }}
      build_source_revision: ${{ steps.version.outputs.build_source_revision }}
      binary_artifact_id: ${{ steps.binary.outputs.artifact-id }}
      binary_sha256: ${{ steps.compile.outputs.sha256 }}
      schema_inputs: ${{ steps.schema.outputs.inputs }}
    timeout-minutes: 20
    env:
      EXPECTED_SOURCE_SHA: ${{ github.event_name == 'push' && github.sha || inputs.expected_source_sha }}
      EXPECTED_SCHEMA_INPUTS: ${{ inputs.expected_schema_inputs }}
      SOURCE_CONTROLLER_SHA: ${{ inputs.source_controller_sha }}
      TEAM_REGISTRY_SHA: ${{ inputs.team_registry_sha }}
      FLOW_REGISTRY_SHA: ${{ inputs.flow_registry_sha }}
      EXECUTOR_REGISTRY_SHA: ${{ inputs.executor_registry_sha }}
      EXECUTOR_DOCKER_OPENHANDS_SHA: ${{ inputs.executor_docker_openhands_sha }}
      GOTOOLCHAIN: local
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Load pinned publisher inputs for branch builds
        if: github.event_name == 'push'
        shell: bash
        run: |
          python3 - <<'PYTHON' >> "$GITHUB_ENV"
          import json
          from pathlib import Path
          import re

          pins = json.loads(Path("qualification/schema-inputs.json").read_text())
          revisions = {}
          for pin in pins:
              publisher = re.fullmatch(r"pandops/flowai-([a-z0-9-]+)", pin["repository"])
              revision = pin["sourceRevision"]
              if not publisher or not re.fullmatch(r"[0-9a-f]{40}", revision):
                  raise SystemExit("Invalid publisher pin")
              key = publisher[1].upper().replace("-", "_") + "_SHA"
              if revisions.setdefault(key, revision) != revision:
                  raise SystemExit("Multiple revisions for one publisher")

          for key, revision in sorted(revisions.items()):
              print(f"{key}={revision}")
          print("EXPECTED_SCHEMA_INPUTS=" + json.dumps(pins, separators=(",", ":")))
          PYTHON

      - name: Verify selected commit and publisher SHAs
        shell: bash
        run: |
          for input in EXPECTED_SOURCE_SHA SOURCE_CONTROLLER_SHA TEAM_REGISTRY_SHA FLOW_REGISTRY_SHA EXECUTOR_REGISTRY_SHA EXECUTOR_DOCKER_OPENHANDS_SHA; do
            if [[ ! "${!input}" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "$input must be a 40-digit hexadecimal commit SHA." >&2
              exit 1
            fi
          done
          if [[ "$GITHUB_SHA" != "${EXPECTED_SOURCE_SHA,,}" ]]; then
            echo 'The workflow ref does not resolve to the selected commit.' >&2
            exit 1
          fi


      - name: Stage declarations and pinned publisher schemas
        shell: bash
        run: |
          (
          source_sha="${EXPECTED_SOURCE_SHA,,}"
          if [[ "$(git rev-parse HEAD)" != "$source_sha" ]]; then
            echo 'The checkout does not match expected_source_sha.' >&2
            exit 1
          fi
          if [[ ! -f go.mod ]]; then
            echo 'Dispatch on the reviewed standalone candidate branch.' >&2
            exit 1
          fi

          contracts="$RUNNER_TEMP/task-manager-contracts"
          mkdir "$contracts"
          mkdir -p "$contracts/qa-e2e/scripts"
          git show "$source_sha:qualification/task-manager-declarations.json" > "$contracts/qa-e2e/scripts/shared-test-inputs.json"

          fetch_schema() {
            local repo="$1" sha="$2" root="$3" file="$4" status
            local url="https://raw.githubusercontent.com/pandops/$repo/${sha,,}/schemas/$file"
            local output="$root/schemas/$file"
            mkdir -p "$contracts/$root/schemas"
            status="$(curl -q --silent --show-error --fail --proto '=https' --max-time 30 \
              --output "$contracts/$output" --write-out '%{http_code}' "$url")"
            if [[ "$status" != 200 ]]; then
              echo "Unexpected HTTP status $status for $url." >&2
              exit 1
            fi
            jq -e 'type == "object"' "$contracts/$output" > /dev/null
            printf '%s ' "$url"
            (cd "$contracts" && sha256sum "$output")
          }

          fetch_schema flowai-source-controller "$SOURCE_CONTROLLER_SHA" svc/source-controller task.schema.json
          fetch_schema flowai-team-registry "$TEAM_REGISTRY_SHA" svc/team-registry event.team_created.schema.json
          for file in defs.schema.json service.targets.request.schema.json service.targets.reply.schema.json; do
            fetch_schema flowai-flow-registry "$FLOW_REGISTRY_SHA" svc/flow-registry "$file"
          done
          for file in event.executor_lost.schema.json event.executor_registered.schema.json event.executor_removed.schema.json; do
            fetch_schema flowai-executor-registry "$EXECUTOR_REGISTRY_SHA" svc/executor-registry "$file"
          done
          for file in claim-token-request.schema.json executor-event.schema.json; do
            fetch_schema flowai-executor-docker-openhands "$EXECUTOR_DOCKER_OPENHANDS_SHA" executor/docker_openhands "$file"
          done
          printf 'FLOWAI_CONTRACT_FIXTURE_DIR=%s\n' "$contracts" >> "$GITHUB_ENV"
          ) | tee "$RUNNER_TEMP/schema-inputs.log"

      - name: Check the tested publisher schema bytes
        id: schema
        shell: bash
        run: |
          python3 - <<'PYTHON' >> "$GITHUB_OUTPUT"
          import json
          import os
          from pathlib import Path
          import re

          pins = json.loads(os.environ["EXPECTED_SCHEMA_INPUTS"])
          expected = {
              (pin["repository"], pin["path"], pin["sourceRevision"], pin["digest"])
              for pin in pins
          }
          observed = set()
          log = Path(os.environ["RUNNER_TEMP"]) / "schema-inputs.log"
          for line in log.read_text().splitlines():
              if not line.startswith("https://raw.githubusercontent.com/"):
                  continue
              match = re.fullmatch(
                  r"https://raw\.githubusercontent\.com/(pandops/flowai-[a-z0-9-]+)/"
                  r"([a-f0-9]{40})/(schemas/[a-zA-Z0-9_./-]+\.json) ([a-f0-9]{64})[ ]+.+",
                  line,
              )
              if not match:
                  raise SystemExit("Invalid publisher schema evidence")
              repository, revision, path, checksum = match.groups()
              entry = (repository, path, revision, "sha256:" + checksum)
              if entry in observed:
                  raise SystemExit("Duplicate publisher schema")
              observed.add(entry)
          if not observed or len(pins) != len(expected) or observed != expected:
              raise SystemExit("Tested schema bytes differ from requested inputs")
          print("inputs=" + json.dumps(pins, separators=(",", ":")))
          PYTHON

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: '1.26.2'
          cache: false

      - name: Unit tests
        shell: bash
        run: go test -mod=readonly -count=1 -coverpkg=./... -v ./... 2>&1 | tee "$RUNNER_TEMP/qualification-unit.log"

      - name: PostgreSQL integration tests
        shell: bash
        run: |
          postgres='docker.io/library/postgres@sha256:a85daf0dbd5e79586e850e3fe4b21b796799828ad015ce2166aeb98cc24da61c'
          docker pull --platform linux/amd64 "$postgres"
          # The existing test fixture resolves this alias in the runner's Docker store.
          docker tag "$postgres" docker.io/library/postgres:16
          go test -mod=readonly -count=1 -tags=integration -v ./test 2>&1 | tee "$RUNNER_TEMP/qualification-integration.log"

      - name: Build the Linux application binary
        id: compile
        if: ${{ inputs.reuse_image == '' }}
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/application"
          source="$RUNNER_TEMP/application-source"
          mkdir "$source"
          git archive --format=tar "$GITHUB_SHA" | tar -xf - -C "$source"
          (
            cd "$source"
            env -i PATH="$PATH" HOME="$HOME" GOENV=off GOTOOLCHAIN=local GOWORK=off \
              CGO_ENABLED=0 GOOS=linux GOARCH=amd64 GOAMD64=v1 \
              go build -mod=readonly -buildvcs=false -trimpath -ldflags='-s -w' \
                -o "$RUNNER_TEMP/application/app" ./cmd/task-manager
          )
          checksum="$(sha256sum "$RUNNER_TEMP/application/app")"
          printf 'sha256=%s\n' "${checksum%% *}" >> "$GITHUB_OUTPUT"

      - name: Prepare the binary from this attempt
        if: ${{ inputs.reuse_image == '' }}
        shell: bash
        run: mv "$RUNNER_TEMP/application/app" "$RUNNER_TEMP/application/app-$GITHUB_RUN_ATTEMPT"

      - name: Retain the application binary
        id: binary
        if: ${{ inputs.reuse_image == '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-${{ github.run_attempt }}
          path: ${{ runner.temp }}/application/app-${{ github.run_attempt }}
          archive: false
          retention-days: 7
          if-no-files-found: error

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: ${{ inputs.reuse_image == '' }}
        with:
          node-version: '24.20.0'
          package-manager-cache: false

      - name: Resolve the artifact version
        id: version
        shell: bash
        env:
          REUSE_PIN: ${{ inputs.reuse_image }}
          PRODUCTION_PATHS: "[\".gitattributes\",\"Containerfile.runtime\",\"cmd\",\"internal\",\"go.mod\",\"go.sum\",\"schemas\"]"
          INITIAL_IMPORT: "chore: extract standalone task-manager"
        run: |
          mapfile -t paths < <(jq -er '.[]' <<< "$PRODUCTION_PATHS")
          workflow_json() {
            git show "$1:$2" | yq -p yaml -o json '.'
          }
          production_tree() {
            local source="$1"
            {
              git ls-tree -r "$source" -- "${paths[@]}" | sed '/_test\.go$/d' || return
              workflow_json "$source" .github/workflows/qualify.yml |
                jq -ce '. as $workflow | .jobs as $jobs | $jobs.application as $job | ($job.steps | map(select((.uses // "") | startswith("actions/setup-go@")) | {uses,with})) as $toolchains | ($job.steps | map(select(.id == "compile") | {shell,run,env})) as $compilers | select(($toolchains | length) == 1 and ($compilers | length) == 1) | {runner:$job."runs-on", defaults:$workflow.defaults, env:$workflow.env, job_defaults:$job.defaults, job_env:$job.env, runtime_files:$jobs.container.with.runtime_files, toolchain:$toolchains[0], compiler:$compilers[0]}' || return
              workflow_json "$source" .github/workflows/v0052-build-push.yml |
                jq -ce '. as $workflow | .jobs.publish as $job | ($job.steps | map(.id) | index("assemble")) as $assemble | select($assemble != null) | {runner:$job."runs-on", defaults:$workflow.defaults, env:$workflow.env, job_defaults:$job.defaults, job_env:$job.env, steps:$job.steps[:($assemble + 1)]}' || return
            } | sha256sum | cut -d ' ' -f1
          }
          identity="$(production_tree "$GITHUB_SHA")"
          printf 'production_identity=sha256:%s\n' "$identity" >> "$GITHUB_OUTPUT"
          release_branch="$GITHUB_REF_NAME"
          stable='(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)'
          version_pattern="^${stable}$"
          stage=stable
          if [[ "$release_branch" != master ]]; then
            stage=snapshot
            # Give each distinct input set its own prerelease channel. This
            # also separates it from the earlier pilot snapshots in GHCR.
            channel="snapshot-${identity:0:16}"
            release_branch="$channel"
            version_pattern="^${stable}-${channel}\.[1-9][0-9]*$"
          fi
          printf 'stage=%s\n' "$stage" >> "$GITHUB_OUTPUT"

          if [[ -n "$REUSE_PIN" ]]; then
            build_source="$(jq -er '.buildSourceRevision | select(test("^[a-f0-9]{40}$"))' <<< "$REUSE_PIN")"
            digest="$(jq -er '.imageDigest | select(test("^sha256:[a-f0-9]{64}$"))' <<< "$REUSE_PIN")"
            version="$(jq -er .version <<< "$REUSE_PIN")"
            [[ "$(production_tree "$build_source")" == "$identity" ]]
            if [[ "$stage" == stable ]]; then
              [[ "$version" =~ ^${stable}$ ]]
            else
              [[ "$version" =~ ^${stable}-[0-9a-zA-Z-]+(\.[0-9a-zA-Z-]+)*$ ]]
            fi
            printf 'version=%s\nbuild_source_revision=%s\nreuse_digest=%s\n' \
              "$version" "$build_source" "$digest" >> "$GITHUB_OUTPUT"
            exit
          fi
          printf 'build_source_revision=%s\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

          mapfile -t existing < <(git tag --points-at "$GITHUB_SHA" | awk '/^v/ {print substr($0,2)}')
          for version in "${existing[@]}"; do
            if [[ "$version" =~ $version_pattern ]]; then
              printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
              exit
            fi
          done

          lock_root="$(mktemp -d "$RUNNER_TEMP/semantic-release.XXXXXXXX")"
          trusted=https://raw.githubusercontent.com/pandops/flowai-team-registry/c18e7cdde5d5b976f549d1dc486f60776cbb8718/.github/semantic-release
          for file in package.json package-lock.json; do
            curl -q --fail --silent --show-error --proto '=https' --max-time 30 "$trusted/$file" -o "$lock_root/$file"
          done
          (cd "$lock_root" && sha256sum --check <<'LOCKS'
          891ec3a55b9fccf0b49fe0ac0a98f9e9fd5bbd7f1743e0f0e51d6286a178d16b  package.json
          aa53698b9420885d999a383abe2f5fafa453bd5aa938dc9ff3ce3e1ef42551a9  package-lock.json
          LOCKS
          npm ci --ignore-scripts --no-audit --no-fund)

          mirror="$RUNNER_TEMP/version.git"
          metadata="$RUNNER_TEMP/version-metadata"
          git clone --quiet --bare --shared "$GITHUB_WORKSPACE" "$mirror"
          git -C "$mirror" update-ref "refs/heads/$release_branch" "$GITHUB_SHA"
          if [[ "$release_branch" != master ]]; then
            git -C "$mirror" update-ref refs/heads/master "$(git rev-parse refs/remotes/origin/master)"
          fi
          git init --quiet --initial-branch="$release_branch" "$metadata"
          git -C "$metadata" remote add origin "$mirror"
          git -C "$metadata" fetch --quiet --tags origin "refs/heads/$release_branch:refs/version-source"
          git -C "$metadata" update-ref "refs/heads/$release_branch" "$GITHUB_SHA"

          jq -n --arg branch "$release_branch" --arg header "$INITIAL_IMPORT" '{
            branches: (["master"] + if $branch == "master" then [] else [{name:$branch, prerelease:$branch, channel:$branch}] end),
            plugins: [["@semantic-release/commit-analyzer",
                       {releaseRules: (if $header == "" then [] else [{header:$header,release:"minor"}] end)}]],
            tagFormat: "v${version}"
          }' > "$metadata/.releaserc.json"
          log="$RUNNER_TEMP/semantic-release.log"
          (
            cd "$metadata"
            env -i PATH="$PATH" HOME="$metadata" LANG=C.UTF-8 NO_COLOR=1 \
              GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_TERMINAL_PROMPT=0 \
              "$lock_root/node_modules/.bin/semantic-release" --dry-run --no-ci --repository-url "$mirror"
          ) 2>&1 | tee "$log"
          version="$(sed -n 's/^.*[Tt]he next release version is //p' "$log")"
          [[ "$version" =~ $version_pattern ]]
          grep -Fq "Skip v$version tag creation in dry-run mode" "$log"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

  container:
    name: Build and publish the runtime container
    needs: application
    permissions:
      actions: read
      contents: write
      packages: write
    uses: ./.github/workflows/v0052-build-push.yml
    with:
      binary_artifact_id: ${{ needs.application.outputs.binary_artifact_id }}
      binary_sha256: ${{ needs.application.outputs.reuse_digest == '' && needs.application.outputs.binary_sha256 || '' }}
      version: ${{ needs.application.outputs.version }}
      runtime_files: '[]'
      qualification: ${{ format('{{"unit":"success","integration":"success","schemaInputs":{0}}}', needs.application.outputs.schema_inputs) }}
      reuse_digest: ${{ needs.application.outputs.reuse_digest }}
      build_source_revision: ${{ needs.application.outputs.build_source_revision }}
      production_identity: ${{ needs.application.outputs.production_identity }}
